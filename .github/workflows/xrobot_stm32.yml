name: build

on:
  push:
    branches: [main, master, dev]
    tags: ['v*']
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        preset: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build and generation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libstdc++-arm-none-eabi-newlib
          python -m pip install -r tools/requirements.txt
      - name: Check generated LibXR integration
        run: |
          python tools/regenerate.py --libxr-only
          git diff --exit-code -- User/app_main.cpp User/app_main.h User/flash_map.hpp User/libxr_config.yaml cmake/LibXR.CMake
          python tools/check_baseline.py
      - name: Build firmware
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }} --parallel 4
      - uses: actions/upload-artifact@v4
        with:
          name: dm02_test-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/dm02_test.elf
            build/${{ matrix.preset }}/dm02_test.hex
            build/${{ matrix.preset }}/dm02_test.bin
            build/${{ matrix.preset }}/dm02_test.map
